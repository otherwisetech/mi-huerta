name: Release

# Builds Mi Huerta for macOS (universal), Linux and Windows.
# - push a tag like v0.2.0 → a GitHub Release with the three downloads (and their .sha256)
# - "Run workflow" by hand → the same builds as workflow artifacts, no release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev libasound2-dev \
            libzstd-dev pkg-config

      - name: Test core crates
        run: cargo test -p mi-huerta-i18n -p mi-huerta-core -p mi-huerta-cli

      - name: Build (macOS universal .app)
        if: runner.os == 'macOS'
        run: |
          UNIVERSAL=1 script/bundle-macos.sh
          mkdir -p dist
          ditto -c -k --keepParent "target/release/Mi Huerta.app" dist/mi-huerta-${{ matrix.name }}.zip
          (cd dist && shasum -a 256 mi-huerta-${{ matrix.name }}.zip > mi-huerta-${{ matrix.name }}.zip.sha256)

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build -p mi-huerta-app -p mi-huerta-cli --release
          pkg=mi-huerta-${{ matrix.name }}
          mkdir -p dist/$pkg
          cp target/release/mi-huerta target/release/mi-huerta-cli dist/$pkg/
          ./target/release/mi-huerta-cli background manifest > dist/$pkg/otherwise-background.json
          cp packaging/linux/mi-huerta.desktop dist/$pkg/
          cp crates/app/assets/logo/mi-huerta-icon-512.png dist/$pkg/mi-huerta.png
          cp README.md LICENSE-MIT LICENSE-APACHE dist/$pkg/
          tar -C dist -czf dist/$pkg.tar.gz $pkg
          rm -rf dist/$pkg
          (cd dist && sha256sum $pkg.tar.gz > $pkg.tar.gz.sha256)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p mi-huerta-app -p mi-huerta-cli --release
          $pkg = "mi-huerta-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path dist/$pkg | Out-Null
          Copy-Item target/release/mi-huerta.exe, target/release/mi-huerta-cli.exe dist/$pkg/
          ./target/release/mi-huerta-cli.exe background manifest | Out-File -Encoding utf8NoBOM dist/$pkg/otherwise-background.json
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE dist/$pkg/
          Compress-Archive -Path dist/$pkg -DestinationPath dist/$pkg.zip
          Remove-Item -Recurse dist/$pkg
          $h = (Get-FileHash dist/$pkg.zip -Algorithm SHA256).Hash.ToLower()
          "$h  $pkg.zip" | Out-File -Encoding ascii dist/$pkg.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mi-huerta-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
