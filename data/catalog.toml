# Catálogo de cuidados de Mi Huerta.
# Regla: cada número cita una fuente de sources.toml que fue abierta y leída.
# Donde no hay un número publicado, va una pista (`hints`) en lugar de inventarlo.
# Conversiones usadas (aritmética, no estimación): 1 mes = 30 días, 1 año = 365 días,
# 1 pulgada = 2,54 cm, "dos veces por semana" = cada 3 días.
schema = 1

# Pisos térmicos colombianos (la fuente da solo altitudes; llama "medio" al templado)
[climates]
source = "unal-agrocol-pisos-2026"
ref = "Resumen / Abstract: macroclimas por altitud"
calido = { min_m = 0, max_m = 1000, note = "Piso cálido (warm)" }
templado = { min_m = 1001, max_m = 2000, note = "La fuente lo llama clima medio (medium)" }
frio = { min_m = 2001, max_m = 3000, note = "Piso frío (cold)" }

